name: Server CI

on:
  pull_request:
  push:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    env:
      # CI must not run the local demo seed, which requires a developer MySQL.
      MOHANO_ENVIRONMENT: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile application modules
        run: python -m compileall -q app alembic

      - name: Run tests
        run: pytest

  terraform-format:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive etc/infra/gcp
